name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # lockfile must carry only registry.npmjs.org URLs (dev box defaults to a Tencent-internal mirror)
      - run: grep -q tencentyun package-lock.json && exit 1 || true
      - run: npm install --no-fund --no-audit
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest run
