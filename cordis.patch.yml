# dsh-weknora bundle layer.
#
# Deliberately inserts no plugin entry: this bundle is a distribution vehicle —
# a skill (skills/dsh-weknora/SKILL.md, discovered by @deepseek-ai/dsh-skill-filesystem
# from ~/.dsh/skills/ or <project>/.dsh/skills/) and a CLI (`weknora-cli`, npm bin).
# A cordis plugin import would fail: the package ships no plugin module.
#
# Install:
#   npm i -g vicfei/dsh-weknora                       # puts weknora-cli on PATH
#   ln -s <repo>/skills/dsh-weknora ~/.dsh/skills/dsh-weknora   # registers the skill
